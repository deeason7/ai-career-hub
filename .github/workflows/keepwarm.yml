name: Keep Warm

# Check the serving application as well as its providers. Scheduled traffic
# does not guarantee residency; schedules run from the default branch only.
on:
  schedule:
    - cron: "0 */6 * * *" # keep everything resident
    - cron: "0 3 * * *" # daily lifecycle cleanup
  workflow_dispatch:
    inputs:
      run-cleanup:
        description: Purge expired documents as well as checking readiness
        type: boolean
        default: false

permissions:
  contents: read

env:
  API_BASE: https://deeason-careerhub.hf.space
  FRONTEND_URL: https://deeason-career.streamlit.app

jobs:
  warm:
    name: Warm the stack
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Record probe runtime
        run: python -c 'import platform, ssl; print(platform.python_version(), ssl.OPENSSL_VERSION)'

      - name: Test probe contracts and HTTP transport
        env:
          CAREERHUB_REQUIRE_NETWORK_TESTS: "1"
        run: python -m unittest discover -s .github/scripts/tests -v

      - name: Check API and datastores
        timeout-minutes: 4
        # v4.4.3 has no semantic signal. Report that limitation explicitly;
        # a present unhealthy semantic signal still fails. Deploy stays strict.
        run: |
          timeout 210s python .github/scripts/readiness.py \
            --api-base "$API_BASE" --allow-missing-semantic

      - name: Check frontend runtime
        if: always()
        timeout-minutes: 4
        # A provider wrapper or redirect cannot establish runtime readiness.
        run: |
          timeout 210s python .github/scripts/readiness.py \
            --frontend-url "$FRONTEND_URL"

  cleanup:
    name: Lifecycle cleanup
    # Read-only dispatches never delete documents. Keep the existing daily cron.
    if: github.event.schedule == '0 3 * * *' || (github.event_name == 'workflow_dispatch' && inputs.run-cleanup)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: free-prod
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Purge expired documents (15-day TTL)
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        # A failed POST is not retried automatically; retain safe status/counts.
        run: |
          python .github/scripts/lifecycle.py --api-base "$API_BASE"
