name: Keep Warm

# Scheduled health checks and document cleanup are independent. A green
# provider page does not prove the app is serving the expected responses.
on:
  schedule:
    - cron: "0 */6 * * *"
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      run-cleanup:
        description: Run production document cleanup from main
        type: boolean
        default: false

permissions:
  contents: read

env:
  API_BASE: https://deeason-careerhub.hf.space
  FRONTEND_URL: https://deeason-career.streamlit.app

jobs:
  api-readiness:
    name: API and datastores
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate API readiness
        run: |
          timeout 150s python .github/scripts/readiness.py \
            --api-base "$API_BASE" --require-redis --report-version \
            --allow-missing-semantic --request-timeout 15 --retry-delay 15

  frontend-readiness:
    name: Streamlit runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate frontend runtime
        run: |
          timeout 150s python .github/scripts/readiness.py \
            --frontend-url "$FRONTEND_URL" --request-timeout 15 --retry-delay 15

  cleanup:
    name: Lifecycle cleanup
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event.schedule == '0 3 * * *' ||
      (github.event_name == 'workflow_dispatch' && inputs.run-cleanup))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: free-prod
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Purge expired documents and report counts
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          timeout 90s python .github/scripts/lifecycle.py --api-base "$API_BASE"
