name: Evals

# Measures the scoring path against the labeled corpus in backend/evals and
# publishes a scorecard. Dispatch-only while the thresholds are still being
# calibrated: the invariance checks report drift rather than gate on it, so a
# run is a measurement, not yet a verdict.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Eval suite to run"
        required: false
        default: "ats-sanity"
        type: choice
        options:
          - ats-sanity
      fail_on_regression:
        description: "Exit non-zero when a gating check fails"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  evals:
    name: Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.dev.txt

      - name: Cache the sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Run the suite
        working-directory: backend
        env:
          SUITE: ${{ inputs.suite }}
          # A dispatch that only measures should not paint the run red.
          FAIL_FLAG: ${{ inputs.fail_on_regression && ' ' || '--no-fail' }}
        run: |
          python -m evals.runner --suite "$SUITE" --json ../scorecard.json $FAIL_FLAG \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-${{ inputs.suite }}
          path: scorecard.json
          if-no-files-found: warn
